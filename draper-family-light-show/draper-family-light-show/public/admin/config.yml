backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/draper-family-light-show   # <-- update after you create the repo
  branch: main
  base_url: https://your-oauth-worker.your-subdomain.workers.dev   # <-- update after deploying the OAuth worker (see README)
  auth_endpoint: auth

publish_mode: simple
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "shows"
    label: "Shows"
    folder: "src/content/shows"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Tagline", name: "tagline", widget: "text" }
      - { label: "Order (controls menu order, 1 = first)", name: "order", widget: "number" }
      - { label: "Accent Color (hex)", name: "accent", widget: "color" }
      - { label: "Hours", name: "hours", widget: "string" }
      - { label: "Months / Dates shown in nav", name: "months", widget: "string" }
      - { label: "Featured on homepage hero?", name: "featured", widget: "boolean", default: false }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
      - { label: "Charity supported", name: "charity", widget: "string", required: false }
      - { label: "Charity donate URL", name: "charityUrl", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "events"
    label: "Event Schedule"
    folder: "src/content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.showSlug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Start Time", name: "startTime", widget: "string", required: false }
      - { label: "End Time", name: "endTime", widget: "string", required: false }
      - label: "Which Show"
        name: "showSlug"
        widget: "select"
        required: false
        options:
          - "scary-on-cherry"
          - "merry-on-cherry"
          - "love-valentines-day"
          - "may-the-4th-be-with-you"
          - "memorial-day"
          - "libertylights-july-4th"
      - { label: "Notes", name: "body", widget: "markdown", required: false }
